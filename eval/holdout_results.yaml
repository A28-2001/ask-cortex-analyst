- id: h5
  category: anomaly
  question: In months flagged as anomalous during 2025, what was the average net revenue retention?
  sql: "SELECT ROUND(AVG(m.net_revenue_retention_pct), 1) FROM mrr_movements m\n                JOIN anomaly_flags\
    \ a ON m.month = a.month\n                WHERE a.anomaly_status = 'flagged' AND a.month BETWEEN '2025-01-01'\
    \ AND '2025-12-31'"
  type: answerable
  ground_truth_value: '100.0'
  generated_sql: "WITH __mrr_movements AS (\n  SELECT\n    month,\n    net_revenue_retention_pct\n  FROM\
    \ nl_assistant_db.analytics.mrr_movements\n), __anomaly_flags AS (\n  SELECT\n    anomaly_status,\n\
    \    month\n  FROM nl_assistant_db.analytics.anomaly_flags\n)\nSELECT\n  AVG(m.net_revenue_retention_pct)\
    \ AS avg_net_revenue_retention_pct\nFROM __mrr_movements AS m\nINNER JOIN __anomaly_flags AS a\n \
    \ ON m.month = a.month\nWHERE\n  a.anomaly_status = 'flagged' AND m.month BETWEEN '2025-01-01' AND\
    \ '2025-12-31'\n -- Generated by Cortex Analyst (request_id: aba5bbcf-721c-4c51-a59b-2d7aae2c4ea7)\n\
    ;"
  cortex_text: 'This is our interpretation of your question:


    In months flagged as anomalous during 2025, what was the average net revenue retention percentage?
    This joins mrr_movements with anomaly_flags to get NRR for only the flagged months in 2025.'
  actual_rows:
  - - 100.0111111111111
  exec_error: null
  latency: 4.12
- id: h6
  category: ambiguous
  question: How much did our MRR grow in the first quarter of 2026?
  sql: "SELECT (SELECT ending_mrr FROM mrr_movements WHERE month = '2026-03-01')\n                   \
    \    - (SELECT starting_mrr FROM mrr_movements WHERE month = '2026-01-01')"
  type: answerable
  ground_truth_value: '958542.5499999998'
  generated_sql: "WITH __mrr_movements AS (\n  SELECT\n    month,\n    starting_mrr,\n    ending_mrr\n\
    \  FROM nl_assistant_db.analytics.mrr_movements\n)\nSELECT\n  (\n    SELECT\n      ending_mrr\n  \
    \  FROM __mrr_movements\n    WHERE\n      month = '2026-03-01'\n  ) - (\n    SELECT\n      starting_mrr\n\
    \    FROM __mrr_movements\n    WHERE\n      month = '2026-01-01'\n  ) AS mrr_growth_q1_2026\n -- Generated\
    \ by Cortex Analyst (request_id: 5d0e655d-f595-4898-a310-2a3d27f5467d)\n;"
  cortex_text: 'This is our interpretation of your question:


    How much did our MRR grow in Q1 2026 (January through March 2026)? This is computed as the ending
    MRR at the end of March 2026 minus the starting MRR at the beginning of January 2026, which equals
    the net change in MRR over the quarter.'
  actual_rows:
  - - 958542.5499999998
  exec_error: null
  latency: 4.05
