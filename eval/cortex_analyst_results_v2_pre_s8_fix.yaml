  generated_sql: "WITH __mrr_movements AS (\n  SELECT\n    month,\n    starting_mrr,\n    ending_mrr\n\
    \  FROM nl_assistant_db.analytics.mrr_movements\n), monthly_mrr AS (\n  SELECT\n    month,\n    ending_mrr\n\
    \  FROM __mrr_movements\n  WHERE\n    month BETWEEN '2025-01-01' AND '2025-12-01'\n  ORDER BY\n  \
    \  month\n), summary AS (\n  SELECT\n    (\n      SELECT\n        ending_mrr\n      FROM __mrr_movements\n\
    \      WHERE\n        month = '2025-12-01'\n    ) AS ending_mrr_dec_2025,\n    (\n      SELECT\n \
    \       starting_mrr\n      FROM __mrr_movements\n      WHERE\n        month = '2025-01-01'\n    )\
    \ AS starting_mrr_jan_2025\n)\nSELECT\n  s.starting_mrr_jan_2025,\n  s.ending_mrr_dec_2025,\n  (\n\
    \    s.ending_mrr_dec_2025 - s.starting_mrr_jan_2025\n  ) AS mrr_growth_absolute,\n  (\n    s.ending_mrr_dec_2025\
    \ - s.starting_mrr_jan_2025\n  ) / NULLIF(NULLIF(s.starting_mrr_jan_2025, 0), 0) AS mrr_growth_pct\n\
