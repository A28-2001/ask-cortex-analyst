  question: What was our MRR growth over 2025?
  ground_truth_sql: "SELECT (SELECT ending_mrr FROM mrr_movements WHERE month = '2025-12-01')\n      \
    \                 - (SELECT starting_mrr FROM mrr_movements WHERE month = '2025-01-01')"
  ground_truth_value: '2665220.95'
  generated_sql: "WITH __mrr_movements AS (\n  SELECT\n    month,\n    ending_mrr\n  FROM nl_assistant_db.analytics.mrr_movements\n\
    ), monthly AS (\n  SELECT\n    month,\n    ending_mrr\n  FROM __mrr_movements\n  WHERE\n    month\
    \ BETWEEN '2025-01-01' AND '2025-12-31'\n), start_val AS (\n  SELECT\n    ending_mrr AS start_mrr\n\
    \  FROM __mrr_movements\n  WHERE\n    month = '2024-12-01'\n), end_val AS (\n  SELECT\n    ending_mrr\
    \ AS end_mrr\n  FROM __mrr_movements\n  WHERE\n    month = '2025-12-01'\n)\nSELECT\n  m.month,\n \
    \ m.ending_mrr,\n  e.end_mrr - s.start_mrr AS mrr_growth_2025\nFROM monthly AS m\nCROSS JOIN start_val\
    \ AS s\nCROSS JOIN end_val AS e\nORDER BY\n  m.month ASC\n -- Generated by Cortex Analyst (request_id:\
    \ 4b82ddf0-7ab1-4eff-8f7b-f07c9da0017d)\n;"
  cortex_text: 'This is our interpretation of your question:


