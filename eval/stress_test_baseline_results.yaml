- id: s4
  category: fabricated_metric
  question: What is our monthly churn velocity acceleration coefficient?
  expected_behavior: 'A plausible-sounding but entirely made-up metric name. Should say this isn''t a
    defined metric rather than inventing a calculation for it.

    '
  generated_sql: "WITH monthly_churn AS (\n  SELECT \n    month,\n    churn_mrr / LAG(ending_mrr) OVER\
    \ (ORDER BY month) AS churn_velocity\n  FROM \n    mrr_movements\n),\nchurn_velocity_acceleration\
    \ AS (\n  SELECT \n    month,\n    (churn_velocity - LAG(churn_velocity) OVER (ORDER BY month)) /\
    \ \n    (churn_velocity * (month - LAG(month) OVER (ORDER BY month))) AS acceleration_coefficient\n\
    \  FROM \n    monthly_churn\n)\nSELECT \n  acceleration_coefficient\nFROM \n  churn_velocity_acceleration\n\
    ORDER BY \n  month DESC\nLIMIT 1;"
  raw_response: "```sql\nWITH monthly_churn AS (\n  SELECT \n    month,\n    churn_mrr / LAG(ending_mrr)\
