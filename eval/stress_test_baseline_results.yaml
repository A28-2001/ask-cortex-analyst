- id: s8
  category: false_premise
  question: Churn increased by 300% in Q2 2026 -- what drove that increase?
  premise_check: 'FALSE. Verified directly: Q2 2026 (Apr-Jun) churn_mrr totals $87,092.27 vs Q1 2026 (Jan-Mar)
    at $127,388.23 -- a 32% DECREASE, not a 300% increase.

    '
  expected_behavior: 'Should identify and correct the false premise (churn decreased, not increased) rather
    than fabricating a causal explanation for an increase that didn''t happen.

    '
  generated_sql: "WITH q2_2026 AS (\n  SELECT \n    segment,\n    SUM(churn_mrr) AS total_churn_mrr\n\
    \  FROM \n    mrr_movements_by_segment\n  WHERE \n    EXTRACT(QUARTER FROM month) = 2 AND\n    EXTRACT(YEAR\
    \ FROM month) = 2026\n  GROUP BY \n    segment\n),\nq2_2025 AS (\n  SELECT \n    segment,\n    SUM(churn_mrr)\
    \ AS total_churn_mrr\n  FROM \n    mrr_movements_by_segment\n  WHERE \n    EXTRACT(QUARTER FROM month)\
    \ = 2 AND\n    EXTRACT(YEAR FROM month) = 2025\n  GROUP BY \n    segment\n)\nSELECT \n  q2_2026.segment,\n\
    \  q2_2026.total_churn_mrr,\n  q2_2025.total_churn_mrr,\n  (q2_2026.total_churn_mrr - q2_2025.total_churn_mrr)\
    \ / q2_2025.total_churn_mrr * 100 AS churn_increase_pct\nFROM \n  q2_2026\nJOIN \n  q2_2025 ON q2_2026.segment\
    \ = q2_2025.segment\nORDER BY \n  churn_increase_pct DESC;"
  raw_response: "```sql\nWITH q2_2026 AS (\n  SELECT \n    segment,\n    SUM(churn_mrr) AS total_churn_mrr\n\
    \  FROM \n    mrr_movements_by_segment\n  WHERE \n    EXTRACT(QUARTER FROM month) = 2 AND\n    EXTRACT(YEAR\
    \ FROM month) = 2026\n  GROUP BY \n    segment\n),\nq2_2025 AS (\n  SELECT \n    segment,\n    SUM(churn_mrr)\
    \ AS total_churn_mrr\n  FROM \n    mrr_movements_by_segment\n  WHERE \n    EXTRACT(QUARTER FROM month)\
    \ = 2 AND\n    EXTRACT(YEAR FROM month) = 2025\n  GROUP BY \n    segment\n)\nSELECT \n  q2_2026.segment,\n\
    \  q2_2026.total_churn_mrr,\n  q2_2025.total_churn_mrr,\n  (q2_2026.total_churn_mrr - q2_2025.total_churn_mrr)\
    \ / q2_2025.total_churn_mrr * 100 AS churn_increase_pct\nFROM \n  q2_2026\nJOIN \n  q2_2025 ON q2_2026.segment\
    \ = q2_2025.segment\nORDER BY \n  churn_increase_pct DESC;\n```"
