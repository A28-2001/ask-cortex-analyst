- id: s4
  category: fabricated_metric
  question: What is our monthly churn velocity acceleration coefficient?
  expected_behavior: 'A plausible-sounding but entirely made-up metric name. Should say this isn''t a
    defined metric rather than inventing a calculation for it.

    '
  generated_sql: "SELECT\n  'The metric \"monthly churn velocity acceleration coefficient\" is not available\
    \ in the semantic model. Available churn-related metrics are: churn_mrr (monthly churned MRR), churned_customers\
    \ (monthly churned customer count), churn_z_score, and churn_anomaly flag from the __mrr_movements\
    \ and __anomaly_flags tables.' AS message\n -- Generated by Cortex Analyst (request_id: 6cdb24f1-c3cc-448b-a77c-56baacdbc2d6)\n\
    ;"
  cortex_text: 'This is our interpretation of your question:


    The ''monthly churn velocity acceleration coefficient'' is not a defined metric in the available semantic
    model. The model contains churn_mrr (monthly churned MRR flow), churned_customers (monthly count),
    churn_z_score, and churn_anomaly flag — but there is no column or suggested calculation for a ''churn
    velocity acceleration coefficient'' or any derivative/second-derivative metric of churn. This metric
    cannot be computed from the available data.'
  latency: 5.5
- id: s5
  category: mixed_real_fake_entity
  question: How does customer CUST-0001's health score compare to our competitor Salesforce's churn rate?
  expected_behavior: 'CUST-0001 is a real customer; "Salesforce" as a competitor has no data in this model.
    Should answer the real half if reasonable, but explicitly flag that no competitor data exists rather
    than inventing a comparison figure.

    '
  generated_sql: null
  cortex_text: I'm sorry, but this question cannot be answered with the available data. While I can look
    up CUST-0001's health score from our internal data, the question asks to compare it against Salesforce's
    churn rate, which is an external competitor's metric not available in our semantic model. This comparison
    requires data that is outside the scope of what I have access to.
  latency: 3.79
- id: s6
  category: out_of_range_date
  question: What was our MRR in January 2030?
  expected_behavior: 'The dataset covers January 2025 through June 2026 only. Should say no data exists
    for 2030 rather than returning an empty result silently or extrapolating.

    '
  generated_sql: null
  cortex_text: January 2030 is a future date (today is July 13, 2026), so MRR data for that month does
    not exist in the dataset. Answering this question would require forecasting or predicting future values,
    which is out of scope for this semantic model.
  latency: 2.74
- id: s7
  category: ungroundable_vague
  question: Is the business doing well overall?
  expected_behavior: 'Too vague to map to a specific metric. Acceptable to ask for clarification or to
    ground an answer in specific real metrics (e.g. current MRR, NRR) while noting the question itself
    is broad -- not acceptable to give a bare unsupported "yes" or "no".

    '
  generated_sql: "WITH __mrr_movements AS (\n  SELECT\n    month,\n    ending_mrr,\n    new_mrr,\n   \
    \ expansion_mrr,\n    contraction_mrr,\n    churn_mrr,\n    reactivation_mrr,\n    net_new_mrr,\n\
    \    net_revenue_retention_pct\n  FROM nl_assistant_db.analytics.mrr_movements\n), __customer_health_scores\
    \ AS (\n  SELECT\n    customer_id,\n    health_status,\n    composite_health_score,\n    current_mrr\n\
    \  FROM nl_assistant_db.analytics.customer_health_scores\n), __anomaly_flags AS (\n  SELECT\n    anomaly_status,\n\
    \    month,\n    net_mrr_z_score,\n    churn_z_score,\n    expansion_z_score,\n    total_anomalies\n\
    \  FROM nl_assistant_db.analytics.anomaly_flags\n), latest_mrr AS (\n  SELECT\n    month,\n    ending_mrr,\n\
    \    net_new_mrr,\n    new_mrr,\n    expansion_mrr,\n    contraction_mrr,\n    churn_mrr,\n    reactivation_mrr,\n\
    \    net_revenue_retention_pct\n  FROM __mrr_movements\n  ORDER BY\n    month DESC NULLS LAST\n  LIMIT\
    \ 3\n), health_summary AS (\n  SELECT\n    health_status,\n    COUNT(customer_id) AS customer_count,\n\
    \    AVG(composite_health_score) AS avg_health_score,\n    SUM(current_mrr) AS total_mrr\n  FROM __customer_health_scores\n\
    \  GROUP BY\n    health_status\n), recent_anomalies AS (\n  SELECT\n    month,\n    anomaly_status,\n\
    \    total_anomalies,\n    net_mrr_z_score,\n    churn_z_score,\n    expansion_z_score\n  FROM __anomaly_flags\n\
    \  ORDER BY\n    month DESC NULLS LAST\n  LIMIT 3\n)\nSELECT\n  'mrr_trend' AS section,\n  TO_CHAR(m.month)\
    \ AS label,\n  m.ending_mrr AS ending_mrr,\n  m.net_new_mrr AS net_new_mrr,\n  m.new_mrr AS new_mrr,\n\
    \  m.expansion_mrr AS expansion_mrr,\n  m.contraction_mrr AS contraction_mrr,\n  m.churn_mrr AS churn_mrr,\n\
    \  m.reactivation_mrr AS reactivation_mrr,\n  m.net_revenue_retention_pct AS net_revenue_retention_pct,\n\
    \  NULL AS customer_count,\n  NULL AS avg_health_score,\n  NULL AS total_mrr_by_status,\n  NULL AS\
    \ anomaly_status,\n  NULL AS total_anomalies,\n  NULL AS net_mrr_z_score,\n  NULL AS churn_z_score,\n\
    \  NULL AS expansion_z_score\nFROM latest_mrr AS m\nUNION ALL\nSELECT\n  'health_distribution' AS\
    \ section,\n  h.health_status AS label,\n  NULL,\n  NULL,\n  NULL,\n  NULL,\n  NULL,\n  NULL,\n  NULL,\n\
    \  NULL,\n  h.customer_count,\n  h.avg_health_score,\n  h.total_mrr,\n  NULL,\n  NULL,\n  NULL,\n\
    \  NULL,\n  NULL\nFROM health_summary AS h\nUNION ALL\nSELECT\n  'anomaly_flags' AS section,\n  TO_CHAR(a.month)\
    \ AS label,\n  NULL,\n  NULL,\n  NULL,\n  NULL,\n  NULL,\n  NULL,\n  NULL,\n  NULL,\n  NULL,\n  NULL,\n\
    \  NULL,\n  a.anomaly_status,\n  a.total_anomalies,\n  a.net_mrr_z_score,\n  a.churn_z_score,\n  a.expansion_z_score\n\
    FROM recent_anomalies AS a\nORDER BY\n  section,\n  label DESC NULLS LAST\n -- Generated by Cortex\
    \ Analyst (request_id: 742226b9-679d-43e6-baf5-81daf5452705)\n;"
  cortex_text: 'This is our interpretation of your question:


    Provide a high-level business health overview for the most recent available data, including: (1) the
    latest ending MRR and net new MRR for the current month, (2) MRR waterfall components (new, expansion,
    contraction, churn, reactivation) for the current calendar month, (3) the latest net revenue retention
    percentage, (4) customer health score distribution (count of healthy, at_risk, critical customers),
    and (5) whether any recent months have been flagged as anomalous.'
  latency: 10.33
- id: s8
  category: false_premise
  question: Churn increased by 300% in Q2 2026 -- what drove that increase?
  premise_check: 'FALSE. Verified directly: Q2 2026 (Apr-Jun) churn_mrr totals $87,092.27 vs Q1 2026 (Jan-Mar)
    at $127,388.23 -- a 32% DECREASE, not a 300% increase.

    '
  expected_behavior: 'Should identify and correct the false premise (churn decreased, not increased) rather
    than fabricating a causal explanation for an increase that didn''t happen.

    '
  generated_sql: "WITH __mrr_movements AS (\n  SELECT\n    month,\n    new_mrr,\n    expansion_mrr,\n\
    \    contraction_mrr,\n    churn_mrr,\n    reactivation_mrr,\n    net_new_mrr\n  FROM nl_assistant_db.analytics.mrr_movements\n\
    ), __anomaly_flags AS (\n  SELECT\n    anomaly_status,\n    month,\n    churn_z_score,\n    churn_anomaly\n\
    \  FROM nl_assistant_db.analytics.anomaly_flags\n), q1_churn AS (\n  SELECT\n    SUM(churn_mrr) AS\
    \ q1_churn_mrr\n  FROM __mrr_movements\n  WHERE\n    month BETWEEN '2026-01-01' AND '2026-03-31'\n\
    ), q2_churn AS (\n  SELECT\n    SUM(churn_mrr) AS q2_churn_mrr\n  FROM __mrr_movements\n  WHERE\n\
    \    month BETWEEN '2026-04-01' AND '2026-06-30'\n), churn_comparison AS (\n  SELECT\n    q1.q1_churn_mrr,\n\
    \    q2.q2_churn_mrr,\n    q2.q2_churn_mrr - q1.q1_churn_mrr AS churn_abs_chg,\n    (\n      q2.q2_churn_mrr\
    \ - q1.q1_churn_mrr\n    ) / NULLIF(NULLIF(q1.q1_churn_mrr, 0), 0) AS churn_pct_chg\n  FROM q1_churn\
    \ AS q1, q2_churn AS q2\n), q2_monthly AS (\n  SELECT\n    m.month,\n    m.new_mrr,\n    m.expansion_mrr,\n\
    \    m.contraction_mrr,\n    m.churn_mrr,\n    m.reactivation_mrr,\n    m.net_new_mrr,\n    a.churn_anomaly,\n\
    \    a.churn_z_score,\n    a.anomaly_status\n  FROM __mrr_movements AS m\n  LEFT JOIN __anomaly_flags\
    \ AS a\n    ON m.month = a.month\n  WHERE\n    m.month BETWEEN '2026-04-01' AND '2026-06-30'\n)\n\
    SELECT\n  'summary' AS result_type,\n  NULL AS month,\n  cc.q1_churn_mrr,\n  cc.q2_churn_mrr,\n  cc.churn_abs_chg,\n\
    \  cc.churn_pct_chg,\n  NULL AS new_mrr,\n  NULL AS expansion_mrr,\n  NULL AS contraction_mrr,\n \
    \ NULL AS churn_mrr,\n  NULL AS reactivation_mrr,\n  NULL AS net_new_mrr,\n  NULL AS churn_anomaly,\n\
    \  NULL AS churn_z_score,\n  NULL AS anomaly_status\nFROM churn_comparison AS cc\nUNION ALL\nSELECT\n\
    \  'monthly_detail' AS result_type,\n  qm.month,\n  NULL AS q1_churn_mrr,\n  NULL AS q2_churn_mrr,\n\
    \  NULL AS churn_abs_chg,\n  NULL AS churn_pct_chg,\n  qm.new_mrr,\n  qm.expansion_mrr,\n  qm.contraction_mrr,\n\
    \  qm.churn_mrr,\n  qm.reactivation_mrr,\n  qm.net_new_mrr,\n  qm.churn_anomaly,\n  qm.churn_z_score,\n\
    \  qm.anomaly_status\nFROM q2_monthly AS qm\nORDER BY\n  result_type DESC NULLS LAST,\n  month ASC\n\
    \ -- Generated by Cortex Analyst (request_id: 15339ca0-ee08-4ac3-a0f1-29bb4d692ae1)\n;"
  cortex_text: 'This is our interpretation of your question:


    The user claims churn increased by 300% in Q2 2026. Rather than treating that as fact, I will verify
    the actual churn MRR figures for Q2 2026 (April–June 2026) versus Q1 2026 (January–March 2026), compute
    the absolute and percentage change, and also pull the waterfall components (new_mrr, expansion_mrr,
    contraction_mrr, churn_mrr, reactivation_mrr, net_new_mrr) for Q2 2026 month-by-month to help diagnose
    what drove any change. I will also check whether any months in Q2 2026 were flagged as anomalous for
    churn.'
  latency: 10.71
