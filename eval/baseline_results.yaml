- id: anom_2
  category: anomaly
  type: answerable
  question: What was the churn z-score in the month with the highest churn MRR in 2025?
  ground_truth_sql: "WITH mc AS (\n                  SELECT month FROM mrr_movements\n               \
    \   WHERE month BETWEEN '2025-01-01' AND '2025-12-31'\n                  ORDER BY churn_mrr DESC LIMIT\
    \ 1)\n                SELECT a.churn_z_score FROM mc JOIN anomaly_flags a ON mc.month = a.month"
  ground_truth_value: '6.1'
  generated_sql: "SELECT a.churn_z_score\nFROM anomaly_flags a\nJOIN (\n  SELECT month, MAX(churn_mrr)\
    \ as max_churn_mrr\n  FROM mrr_movements\n  WHERE EXTRACT(YEAR FROM month) = 2025\n  GROUP BY month\n\
    ) b\nON a.month = b.month\nORDER BY b.max_churn_mrr DESC\nLIMIT 1;"
  raw_response: "```sql\nSELECT a.churn_z_score\nFROM anomaly_flags a\nJOIN (\n  SELECT month, MAX(churn_mrr)\
    \ as max_churn_mrr\n  FROM mrr_movements\n  WHERE EXTRACT(YEAR FROM month) = 2025\n  GROUP BY month\n\
    ) b\nON a.month = b.month\nORDER BY b.max_churn_mrr DESC\nLIMIT 1;\n```"
  actual_rows:
  - - 6.1
  exec_error: null
  latency: 0.52
  score: 1.0
  verdict: correct
  reason: Exact match.
