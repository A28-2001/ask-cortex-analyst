- id: seg_4
  category: segment
  type: answerable
  question: What drove the July 2025 SMB churn increase?
  ground_truth_sql: SELECT new_mrr, expansion_mrr, contraction_mrr, churn_mrr FROM mrr_movements_by_segment
    WHERE segment = 'smb' AND month = '2025-07-01'
  ground_truth_value: '[(14025.54, 1314.77, 1316.87, 19629.01)]'
  generated_sql: "WITH smb_churn AS (\n  SELECT \n    month,\n    churn_mrr,\n    LAG(churn_mrr) OVER\
    \ (ORDER BY month) AS prev_churn_mrr\n  FROM \n    mrr_movements_by_segment\n  WHERE \n    segment\
    \ = 'SMB'\n)\nSELECT \n  month,\n  churn_mrr,\n  prev_churn_mrr,\n  churn_mrr - prev_churn_mrr AS\
    \ churn_increase\nFROM \n  smb_churn\nWHERE \n  month = '2025-07-01'"
  raw_response: "```sql\nWITH smb_churn AS (\n  SELECT \n    month,\n    churn_mrr,\n    LAG(churn_mrr)\
    \ OVER (ORDER BY month) AS prev_churn_mrr\n  FROM \n    mrr_movements_by_segment\n  WHERE \n    segment\
